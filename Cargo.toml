[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
  "crates/stav",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/QaidVoid/stav"
version = "0.1.0"

[workspace.dependencies]
insta = { version = "1.49.0", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
regex-syntax = { version = "0.8.11", default-features = false, features = ["std", "unicode"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
print_stdout = "warn"
